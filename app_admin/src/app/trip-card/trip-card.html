<div class="trip-card h-100">
  <div class="trip-card-header">
    {{ trip.name }}
  </div>

  <img [src]="'http://localhost:3000' + trip.image"
       [alt]="trip.name + ' trip image'"
       class="trip-card-image">

  <div class="trip-card-body">
    <h6 class="trip-card-resort">
      {{ trip.resort }}
    </h6>

    <p class="trip-card-price">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </p>

    <p class="trip-card-description"
       [innerHTML]="trip.description"></p>

    <div class="trip-card-actions"
         *ngIf="isLoggedIn()">
      <button type="button"
              class="btn edit-button"
              (click)="editTrip()">
        Edit Trip
      </button>

      <button type="button"
              class="btn delete-button"
              (click)="deleteTrip()">
        Delete Trip
      </button>
    </div>
  </div>
</div>
