<div class="admin-page">
  <header class="admin-header">
    <div class="admin-header-content">
      <a class="admin-brand" routerLink="/">
        <img src="assets/images/logo.png"
             alt="Travlr Getaways"
             class="admin-logo">

        <span class="brand-admin">ADMIN</span>
      </a>

      <nav class="admin-nav">
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Trips
        </a>

        <a routerLink="/add-trip"
           routerLinkActive="active"
           *ngIf="isLoggedIn()">
          Add Trip
        </a>

        <a routerLink="/login"
           routerLinkActive="active"
           *ngIf="!isLoggedIn()">
          Log In
        </a>

        <a href="#"
           (click)="onLogout(); $event.preventDefault()"
           *ngIf="isLoggedIn()">
          Log Out
        </a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
